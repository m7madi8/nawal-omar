<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga Admin Dashboard</title>
  <link rel="icon" type="image/png" href="../public/media/brand/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar" id="dashboardSidebar" aria-label="Operations navigation">
      <div class="sidebar-drawer-head">
        <div class="sidebar-brand">
          <h1 class="sidebar-title">Nawal Omar</h1>
          <p class="sidebar-subtitle">Calm operations panel</p>
        </div>
        <button id="sidebarCloseBtn" class="sidebar-close mobile-icon-btn" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Request categories"></nav>
      <button id="logoutBtn" class="btn btn-ghost sidebar-logout" type="button">Logout</button>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

    <main class="main-content">
      <header class="mobile-topbar" id="mobileTopbar">
        <button
          id="sidebarMenuToggle"
          class="mobile-icon-btn"
          type="button"
          aria-expanded="false"
          aria-controls="dashboardSidebar"
          aria-label="Open menu"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="mobile-topbar-brand">
          <p class="mobile-topbar-wordmark">Nawal Omar</p>
          <p class="mobile-topbar-section" id="mobileSectionLabel">Mountain Voice Health</p>
        </div>
        <button id="refreshBtn" class="mobile-icon-btn" type="button" aria-label="Refresh requests">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12a8 8 0 1 1-2.2-5.5"/>
            <path d="M20 4v5h-5"/>
          </svg>
        </button>
      </header>

      <header class="summary-grid" id="summaryGrid" aria-label="Dashboard Summary"></header>

      <section class="panel-card" id="requestsPanel">
        <div class="panel-top">
          <h2 id="sectionTitle">Mountain Voice Health</h2>
          <div class="filters" role="group" aria-label="Filter Requests">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="pending" type="button">Pending</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <div id="requestsContainer" class="requests-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <h3>No requests currently</h3>
          <p>There are no real requests yet.</p>
        </div>
      </section>

      <div id="requestModal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-head">
            <h3 id="modalTitle">Full Registration Details</h3>
            <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Close">&times;</button>
          </div>
          <div id="modalBody" class="modal-body"></div>
        </div>
      </div>

    </main>
  </div>

  <script>
    window.YOGA_DASHBOARD_CONFIG = {
      supabaseUrl: "https://xzxyskufrqansbhsbdkt.supabase.co",
      supabaseAnonKey: "sb_publishable_V9_4QWGDFv6Vm-4DQifYGA_1xdoKkph",
      supabaseTable: "retreat_requests"
    };
  </script>
  <script src="script.js"></script>
</body>
</html>
